# Frontend UI — horizontally scalable web interface.
#
# Components:
#   - Deployment (replicas: 2, configurable)
#   - NodePort Service (external web access on port 30000)
#
# IMPORTANT: Replace <YOUR_DOCKERHUB_USERNAME> with your Docker Hub username.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: multi-agent
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: vikasteja/frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: CODER_AGENT_URL
              value: "http://coder-agent.multi-agent.svc.cluster.local:8000"
            - name: REVIEWER_AGENT_URL
              value: "http://reviewer-agent.multi-agent.svc.cluster.local:8001"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: multi-agent
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
