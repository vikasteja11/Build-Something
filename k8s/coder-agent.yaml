# Coder Agent — horizontally scalable deployment with external access.
#
# Components:
#   - Deployment (replicas: 2, configurable)
#   - NodePort Service (external access on port 30080)
#
# IMPORTANT: Replace <YOUR_DOCKERHUB_USERNAME> with your Docker Hub username.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-agent
  namespace: multi-agent
  labels:
    app: coder-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: coder-agent
  template:
    metadata:
      labels:
        app: coder-agent
    spec:
      containers:
        - name: coder-agent
          image: vikasteja/coder-agent:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: multi-agent-secrets
                  key: DATABASE_URL
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: multi-agent-secrets
                  key: OPENROUTER_API_KEY
            - name: REVIEWER_URL
              value: "http://reviewer-agent.multi-agent.svc.cluster.local:8001"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: coder-agent
  namespace: multi-agent
spec:
  type: NodePort
  selector:
    app: coder-agent
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
